body:
  text: 太陽中風陽浮而隂弱陽浮者熱自發隂弱者汗自出嗇嗇惡寒淅淅惡風翕翕發熱鼻鳴乾嘔者桂枝湯主之桂枝湯方桂枝三兩去皮芍藥三兩甘草二兩炙生薑三兩切大棗十二枚擘右五味㕮咀三味以水七升微火煮取三升去滓適寒溫服一升服已須臾啜熱稀粥一升餘以助藥力溫覆令一時許遍身漐漐微似有汗者益佳不可令如水流漓病必不除若一服汗出病差停後服不必盡劑若不汗更服依前法又不汗後服小促其間半日許令三服盡若病重者一日一夜服周時觀之服一劑盡病證猶在者更作服若不汗出乃服至二三劑禁生冷黏滑肉麵五辛酒酪臭惡等物太陽病項背強𠘧𠘧反汗出惡風者桂枝加葛根湯主之桂枝加葛根湯方葛根四兩桂枝二兩去皮芍藥二兩生薑三兩切甘草二兩炙大棗十二枚擘麻黃三兩去節右七味以水一斗先煮麻黃葛根減二升去上沫內諸藥煮取三升去滓溫服一升覆取微似汗不須啜粥餘如桂枝法將息及禁忌太陽病發汗遂漏不止其人惡風小便難四肢微急難以屈伸者桂枝加附子湯主之桂枝加附子湯方桂枝三兩去皮芍藥三兩甘草三兩炙生薑三兩切大棗十二枚擘附子一枚炮去皮破八片右六味以水七升煮取三升去滓溫服一升夲云玉函經作本方桂枝湯𫝆加附子將息如前法太陽病下之後脈促胸滿者桂枝去芍藥湯主之桂枝去芍藥湯方桂枝三兩去皮甘草二兩炙生薑三兩切大棗十二枚擘右四味以水七升煮取三升去滓溫服一升夲云桂枝湯𫝆去芍藥將息如前法若微寒者桂枝去芍藥加附子湯主之桂枝去芍藥加附子湯方桂枝三兩去皮甘草二兩炙生薑三兩切大棗十二枚擘附子一枚炮去皮破八片右五味以水七升煮取三升去滓溫服一升夲云桂枝湯𫝆去芍藥加附子將息如前法太陽病得之八九日如瘧狀發熱惡寒熱多寒少其人不嘔清便欲自可一日二三度發脈微緩者為欲愈也脈微而惡寒者此隂陽俱虗不可更發汗更下更吐也靣色反有熱色者未欲解也以其不能得小汗出身必癢宜桂枝麻黃各半湯桂枝麻黃各半湯方桂枝一兩十六銖去皮芍藥生薑切甘草炙麻黃去節各一兩大棗四枚擘杏仁二十四枚湯浸去皮尖及兩仁者右七味以水五升先煮麻黃一二沸去上沫內諸藥煮取一升八合去滓溫服六合夲云桂枝湯三合麻黃湯三合併為六合頓服將息如上法服桂枝湯大汗出脈洪大者與桂枝湯如前法若形似瘧一日再發者汗出必解宜桂枝二麻黃一湯桂枝二麻黃一湯方桂枝一兩十七銖去皮芍藥一兩六銖麻黃十六銖去節生薑一兩六銖切杏仁十六個去皮尖甘草一兩二銖炙大棗五枚擘右七味以水五升先煮麻黃一二沸去上沫內諸藥煮取二升去滓溫服一升日再服夲云桂枝湯二分麻黃湯一分合為二升分再服𫝆後合為一方將息如前法服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯主之白虎加人參湯方知母六兩石膏一斤碎綿裹甘草二兩炙粳米六合人參三兩右五味以水一斗煮米熟湯成去滓溫服一升日三服太陽病發熱惡寒熱多寒少脈微弱者此無陽也不可發汗宜桂枝二越婢一湯桂枝二越婢一湯方桂枝去皮芍藥麻黃甘草炙各十八銖大棗四枚擘生薑一兩二銖切石膏二十四銖碎綿裹右七味以水五升煮麻黃一二沸去上沫內諸藥煮取二升去滓溫服一升夲云當裁為越婢湯桂枝湯合之飲一升𫝆合為一方桂枝二分越婢湯一分服桂枝湯或下之仍頭項強痛翕翕發熱無汗心下滿微痛小便不利者桂枝去桂加茯苓白朮湯主之桂枝去桂加茯苓白朮湯方芍藥三兩甘草二兩炙生薑三兩切白朮茯苓各三兩大棗十二枚擘右六味以水八升煮取三升去滓溫服一升小便利則愈夲云桂枝湯𫝆去桂枝加茯苓白朮傷寒脈浮自汗出小便數心煩微惡寒腳攣急反與桂枝欲攻其表此誤也得之便厥咽中乾煩躁吐逆者作甘草乾薑湯與之以復其陽若厥愈足溫者更作芍藥甘草湯與之其腳即伸若胃氣不和譫語者少與調胃承氣湯若重發汗復加燒針者四逆湯主之甘草乾薑湯方甘草四兩炙乾薑二兩右二味以水三升煮取一升五合去滓分溫再服芍藥甘草湯方芍藥甘草炙各四兩右二味以水三升煮取一升五合去滓分溫再服調胃承氣湯方甘草二兩炙芒硝半升大黃四兩清酒洗右三味以水三升煮取一升去滓內芒硝更上火微煮令沸少少溫服之四逆湯方甘草二兩炙乾薑一兩半附子一枚生用去皮破八片右三味以水三升煮取一升二合去滓分溫再服強人可大附子一枚乾薑三兩太陽病項背強𠘧𠘧無汗惡風葛根湯主之葛根湯方葛根四兩麻黃三兩去節桂枝二兩去皮生薑三兩切甘草二兩炙芍藥二兩大棗十二枚擘右七味以水一斗先煮麻黃葛根減二升去白沫內諸藥煮取三升去滓溫服一升覆取微似汗餘如桂枝法將息及禁忌諸湯皆仿此太陽與陽明合病不下利但嘔者葛根加半夏湯主之葛根加半夏湯方葛根四兩麻黃三兩去節甘草二兩炙芍藥二兩桂枝二兩去皮生薑二兩切半夏半升洗大棗十二枚擘右八味以水一斗先煮葛根麻黃減二升去白沫內諸藥煮取三升去滓溫服一升覆取微似汗太陽病桂枝證醫反下之利遂不止脈促者表未解也喘而汗出者葛根黃芩黃連湯主之葛根黃芩黃連湯方葛根半斤甘草二兩炙黃芩三兩黃連三兩右四味以水八升先煮葛根減二升內諸藥煮取二升去滓分溫再服太陽病頭痛發熱身疼腰痛骨節疼痛惡風無汗而喘者麻黃湯主之麻黃湯方麻黃三兩去節桂枝二兩去皮甘草一兩炙杏仁七十個去皮尖右四味以水九升先煮麻黃減二升去上沫內諸藥煮取二升半去滓溫服八合覆取微似汗不須啜粥餘如桂枝法將息太陽中風脈浮緊發熱惡寒身疼痛不汗出而煩躁者大青龍湯主之若脈微弱汗出惡風者不可服之服之則厥逆筋惕肉瞤此為逆也大青龍湯方麻黃六兩去節桂枝二兩去皮甘草二兩炙杏仁四十枚去皮尖生薑三兩切大棗十枚擘石膏如雞子大碎右七味以水九升先煮麻黃減二升去上沫內諸藥煮取三升去滓溫服一升取微似汗汗出多者溫粉撲之一服汗者停後服若復服汗多亡陽遂虗惡風煩躁不得眠也傷寒表不解心下有水氣乾嘔發熱而咳或渴或利或噎或小便不利少腹滿或喘者小青龍湯主之小青龍湯方麻黃去節芍藥細辛乾薑甘草炙桂枝去皮各三兩五味子半升半夏半升洗右八味以水一斗先煮麻黃減二升去上沫內諸藥煮取三升去滓溫服一升若渴去半夏加栝樓根三兩若微利去麻黃加蕘花如一雞子熬令赤色若噎者去麻黃加附子一枚炮若小便不利少腹滿者去麻黃加茯苓四兩若喘去麻黃加杏仁半升去皮尖且蕘花不治利麻黃主喘𫝆此語反之疑非仲景意太陽病下之微喘者表未解故也桂枝加厚朴杏子湯主之桂枝加厚朴杏子湯方桂枝三兩去皮甘草二兩炙生薑三兩切芍藥三兩大棗十二枚擘厚朴二兩炙去皮杏仁五十枚去皮尖右七味以水七升微火煮取三升去滓溫服一升覆取微似汗下之後復發汗晝日煩躁不得眠夜而安靜不嘔不渴無表證脈沈微身無大熱者乾薑附子湯主之乾薑附子湯方乾薑一兩附子一枚生用去皮切八片右二味以水三升煮取一升去滓頓服發汗後身疼痛脈沈遲者桂枝加芍藥生薑各一兩人參三兩新加湯主之桂枝加芍藥生薑各一兩人參三兩新加湯方桂枝三兩去皮芍藥四兩甘草二兩炙人參三兩大棗十二枚擘生薑四兩右六味以水一斗二升煮取三升去滓溫服一升夲云桂枝湯𫝆加芍藥生薑人參發汗後不可更行桂枝湯汗出而喘無大熱者可與麻黃杏仁甘草石膏湯麻黃杏仁甘草石膏湯方麻黃四兩去節杏仁五十個去皮尖甘草二兩炙石膏半斤碎綿裹右四味以水七升煮麻黃減二升去上沫內諸藥煮取二升去滓溫服一升發汗過多其人叉手自冒心心下悸欲得按者桂枝甘草湯主之桂枝甘草湯方桂枝四兩去皮甘草二兩炙右二味以水三升煮取一升去滓頓服發汗後其人臍下悸者欲作奔豚茯苓桂枝甘草大棗湯主之茯苓桂枝甘草大棗湯方茯苓半斤桂枝四兩去皮甘草二兩炙大棗十五枚擘右四味以甘瀾水一斗先煮茯苓減二升內諸藥煮取三升去滓溫服一升日三服作甘瀾水法取水二斗置大盆內以杓揚之水上有珠子五六千顆相逐取用之發汗後腹脹滿者厚朴生薑半夏甘草人參湯主之厚朴生薑半夏甘草人參湯方厚朴半斤炙去皮生薑半斤切半夏半升洗甘草二兩炙人參一兩右五味以水一斗煮取三升去滓溫服一升日三服傷寒若吐若下後心下逆滿氣上衝胸起則頭眩脈沈緊發汗則動經身為振振搖者茯苓桂枝白朮甘草湯主之茯苓桂枝白朮甘草湯方茯苓四兩桂枝三兩去皮白朮甘草炙各二兩右四味以水六升煮取三升去滓分溫三服發汗病不解反惡寒者虗故也芍藥甘草附子湯主之芍藥甘草附子湯方芍藥甘草各三兩炙附子一枚炮去皮破八片右三味以水五升煮取一升五合去滓分溫三服發汗若下之病仍不解煩躁者茯苓四逆湯主之茯苓四逆湯方茯苓四兩人參一兩附子一枚生用去皮破八片甘草二兩炙乾薑一兩半右五味以水五升煮取三升去滓溫服七合日二服太陽病發汗後大汗出胃中乾煩躁不得眠欲得飲水者少少與飲之令胃氣和則愈若脈浮小便不利微熱消渴者五苓散主之五苓散方豬苓十八銖去皮澤瀉一兩六銖白朮十八銖茯苓十八銖桂枝半兩去皮右五味搗為散以白飲和服方寸匕日三服多飲暖水汗出愈如法將息傷寒汗出而渴者五苓散主之不渴者茯苓甘草湯主之茯苓甘草湯方茯苓二兩桂枝二兩去皮甘草一兩炙生薑三兩切右四味以水四升煮取二升去滓分溫三服發汗後水藥不得入口為逆若更發汗必吐下不止發汗吐下後虗煩不得眠若劇者必反復顛倒心中懊憹梔子豉湯主之若少氣者梔子甘草豉湯主之若嘔者梔子生薑豉湯主之梔子豉湯方梔子十四個擘香豉四合綿裹右二味以水四升先煮梔子得二升半內豉煮取一升半去滓分為二服溫進一服得吐者止後服梔子甘草豉湯方梔子十四個擘甘草二兩炙香豉四合綿裹右三味以水四升先煮梔子甘草取二升半內豉煮取一升半去滓分二服溫進一服得吐者止後服梔子生薑豉湯方梔子十四個擘生薑五兩切香豉四合綿裹右三味以水四升先煮梔子生薑取二升半內豉煮取一升半去滓分二服溫進一服得吐者止後服傷寒下後心煩腹滿臥起不安者梔子厚朴湯主之梔子厚朴湯方梔子十四個擘厚朴四兩炙去皮枳實四枚水浸炙令黃右三味以水三升半煮取一升半去滓分二服溫進一服得吐者止後服傷寒醫以丸藥大下之身熱不去微煩者梔子乾薑湯主之梔子乾薑湯方梔子十四個擘乾薑二兩右二味以水三升半煮取一升半去滓分二服溫進一服得吐者止後服太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲劈地者真武湯主之真武湯方茯苓芍藥生薑切各三兩白朮二兩附子一枚炮去皮破八片右五味以水八升煮取三升去滓溫服七合日三服汗家重發汗必恍惚心亂小便已隂疼與禹餘糧丸禹餘糧方闕傷寒五六日中風往來寒熱胸脅苦滿默默不欲飲食心煩喜嘔或胸中煩而不嘔或渴或腹中痛或脅下痞鞕或心下悸小便不利或不渴身有微熱或咳者小柴胡湯主之小柴胡湯方柴胡半斤黃芩三兩人參三兩半夏半升洗甘草炙生薑切各三兩大棗十二枚擘右七味以