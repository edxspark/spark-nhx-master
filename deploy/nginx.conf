# 倪师 AI · Nginx 反向代理配置
#
# 放到 /etc/nginx/conf.d/nishi-ai.conf（或 sites-available）
#
# ⚠️ SSE 关键配置：`proxy_buffering off`
# 不关掉它，流式输出会被 Nginx 缓冲成一坨，用户要等全部生成完才看到内容。

upstream nishi_ai {
    server 127.0.0.1:8790;
    keepalive 16;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.com;

    # ── 证书 ────────────────────────────────────────────────────────────
    # 用 certbot 申请： certbot --nginx -d ai.example.com
    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头 ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 请求体与超时 ────────────────────────────────────────────────────
    client_max_body_size 4m;
    client_body_timeout 60s;

    # ── 压缩（SSE 不要压缩，否则也会被缓冲）────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── 对话流式接口（SSE）──────────────────────────────────────────────
    location = /api/chat {
        proxy_pass http://nishi_ai;
        proxy_http_version 1.1;

        # ★★★ 这三行是 SSE 能逐字输出的关键 ★★★
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 长连接：生成较慢时不要被 Nginx 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── 其余接口 ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://nishi_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        # 登录接口限速，缓解爆破（应用层另有 5 次锁定 15 分钟）
        limit_req zone=nishi_login burst=10 nodelay;
    }

    # ── 静态资源 ────────────────────────────────────────────────────────
    location / {
        proxy_pass http://nishi_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 限速区（需放在 http {} 块内，若本文件已是 http 层级则保留此处）──────
